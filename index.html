<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OrgaFood</title>
<meta name="theme-color" content="#F5F3FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OrgaFood">

<style>:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: sticky wordmark header, one scrolling view, bottom tab bar with one colour per section. */
:root{
  --font-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#F5F3FF;--surface:#FFFFFF;--fg:#231B3A;--muted:#6B6486;--line:#E6E1F5;
  --coral:#FF5B4F;--sky:#2E9BFF;--leaf:#1FB574;--sun:#FFB020;--berry:#A855F7;
  --coral-s:#FFE9E6;--sky-s:#E3F2FF;--leaf-s:#DDF7EA;--sun-s:#FFF1D2;--berry-s:#F1E4FF;
  --coral-ink:#C7352B;--sky-ink:#0F6FCC;--leaf-ink:#0E7F4F;--sun-ink:#8A5A00;--berry-ink:#7C2FD0;
  --on-accent:#FFFFFF;--shadow:0 6px 18px rgba(60,40,120,.10);
  --tab:var(--coral);--tab-s:var(--coral-s);--tab-ink:var(--coral-ink);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17132A;--surface:#221C3B;--fg:#F3F0FF;--muted:#A9A1C6;--line:#352D55;
  --coral-s:#4A2430;--sky-s:#1D3350;--leaf-s:#1B3D33;--sun-s:#4A3B1A;--berry-s:#38245A;
  --coral-ink:#FF8A80;--sky-ink:#7CC0FF;--leaf-ink:#5FE0A5;--sun-ink:#FFD27A;--berry-ink:#D2A8FF;
  --shadow:0 6px 18px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17132A;--surface:#221C3B;--fg:#F3F0FF;--muted:#A9A1C6;--line:#352D55;
  --coral-s:#4A2430;--sky-s:#1D3350;--leaf-s:#1B3D33;--sun-s:#4A3B1A;--berry-s:#38245A;
  --coral-ink:#FF8A80;--sky-ink:#7CC0FF;--leaf-ink:#5FE0A5;--sun-ink:#FFD27A;--berry-ink:#D2A8FF;
  --shadow:0 6px 18px rgba(0,0,0,.35);color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 110px;-webkit-tap-highlight-color:transparent}
body[data-tab="plan"]{--tab:var(--sky);--tab-s:var(--sky-s);--tab-ink:var(--sky-ink)}
body[data-tab="shop"]{--tab:var(--leaf);--tab-s:var(--leaf-s);--tab-ink:var(--leaf-ink)}
body[data-tab="pantry"]{--tab:var(--sun);--tab-s:var(--sun-s);--tab-ink:var(--sun-ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--tab);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;font-weight:600;text-wrap:balance}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding:14px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.logo{font-family:var(--font-display);font-weight:700;font-size:30px;letter-spacing:-.5px;line-height:1}
.logo span:nth-child(1){color:var(--coral)}.logo span:nth-child(2){color:var(--sun)}.logo span:nth-child(3){color:var(--leaf)}.logo span:nth-child(4){color:var(--sky)}.logo span:nth-child(5){color:var(--berry)}
.logo span:nth-child(6){color:var(--coral)}.logo span:nth-child(7){color:var(--sun)}.logo span:nth-child(8){color:var(--leaf)}.logo span:nth-child(9){color:var(--sky)}
#sub{color:var(--muted);font-weight:700;font-size:14px;text-align:right}

/* generic */
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 14px;flex-wrap:wrap}
.head h2{font-size:24px}
.btn{background:var(--tab);color:var(--on-accent);font-weight:800;padding:11px 18px;border-radius:999px;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px}
body[data-tab="pantry"] .btn:not(.ghost):not(.danger){color:#3B2600}
.btn.ghost{background:var(--tab-s);color:var(--tab-ink);box-shadow:none}
.btn.danger{background:var(--coral-s);color:var(--coral-ink);box-shadow:none}
.btn.small{padding:7px 13px;font-size:14px}
.btn:active{transform:scale(.97)}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.empty{text-align:center;padding:34px 18px;color:var(--muted)}
.empty b{display:block;font-family:var(--font-display);font-size:20px;color:var(--fg);margin-bottom:6px}
input,select,textarea{width:100%;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:11px 13px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--tab);outline:none}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:800;font-size:14px;color:var(--muted)}
.banner{background:var(--sun-s);color:var(--sun-ink);border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px;font-weight:700;font-size:14px}
.stepper{display:inline-flex;align-items:center;background:var(--tab-s);border-radius:999px;padding:3px}
.stepper button{width:34px;height:34px;border-radius:50%;background:var(--surface);color:var(--tab-ink);font-weight:800;font-size:20px;line-height:1;box-shadow:var(--shadow)}
.stepper output{min-width:78px;text-align:center;font-weight:800;color:var(--tab-ink);padding:0 6px}

/* recipes */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.rc{overflow:hidden;text-align:left;display:flex;flex-direction:column;width:100%}
.cover{aspect-ratio:4/3;width:100%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:54px;font-weight:700}
.cv0{background:var(--coral-s);color:var(--coral-ink)}.cv1{background:var(--sky-s);color:var(--sky-ink)}.cv2{background:var(--leaf-s);color:var(--leaf-ink)}.cv3{background:var(--sun-s);color:var(--sun-ink)}.cv4{background:var(--berry-s);color:var(--berry-ink)}
.rc .meta{padding:10px 12px 13px;display:flex;flex-direction:column;gap:3px;min-width:0}
.rc h3{font-size:17px;line-height:1.2}
.rc small{color:var(--muted);font-weight:700}
.search{margin-bottom:14px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;background:rgba(20,10,50,.5)}
#sheet.open{display:flex}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:-6px auto 12px}
.stack{display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photo{display:block;border-radius:22px;overflow:hidden;cursor:pointer;position:relative;background:var(--coral-s);color:var(--coral-ink);min-height:150px}
.photo img{display:block;width:100%;max-height:260px;object-fit:cover}
.photo .ph{display:flex;align-items:center;justify-content:center;min-height:150px;font-weight:800;text-align:center;padding:12px}
.ing{display:grid;grid-template-columns:minmax(0,1fr) 64px 78px 36px;gap:6px;margin-bottom:6px}
.ing button{color:var(--coral-ink);font-size:22px;font-weight:800}
.hero{border-radius:22px;overflow:hidden}
.hero .cover{font-size:70px}
.ilist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ilist li{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:2px dashed var(--line)}
.ilist li b{white-space:nowrap;color:var(--coral-ink)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--sun);color:#3B2600;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}

/* planning */
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav button{width:38px;height:38px;border-radius:50%;background:var(--tab-s);color:var(--tab-ink);font-size:20px;font-weight:800}
.weeknav .lbl{font-weight:800;flex:1;text-align:center}
.day{padding:12px 14px;margin-bottom:12px;display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px}
.day.today{outline:3px solid var(--sky)}
.dn{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--sky-s);color:var(--sky-ink);border-radius:16px;padding:6px 0;font-family:var(--font-display);font-weight:600}
.dn b{font-size:24px;line-height:1}.dn span{font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.slots{display:flex;flex-direction:column;gap:8px;min-width:0}
.slot{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border-radius:14px;padding:7px 10px;background:var(--bg);min-height:46px}
.slot.filled{background:var(--sky-s)}
.slot .t{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);width:72px;flex:none}
.slot .n{flex:1;min-width:0;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .p{font-weight:800;color:var(--sky-ink);flex:none;font-size:14px}
.slot .add{color:var(--muted);font-weight:700}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px;border-radius:16px;background:var(--surface)}
.pick .th{width:48px;height:48px;border-radius:12px;flex:none;object-fit:cover;font-size:22px}
.th{display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700}

/* shopping */
.prog{height:12px;background:var(--leaf-s);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.prog i{display:block;height:100%;background:var(--leaf);border-radius:99px;transition:width .3s}
.aisle{font-family:var(--font-display);font-weight:600;color:var(--leaf-ink);margin:18px 0 8px;font-size:17px}
.it{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:16px;background:var(--surface);margin-bottom:8px;box-shadow:var(--shadow)}
.ck{flex:none;width:26px;height:26px;border-radius:9px;border:3px solid var(--leaf);display:flex;align-items:center;justify-content:center;color:transparent;font-weight:800}
.it.done .ck{background:var(--leaf);color:#fff}
.it.done .nm{text-decoration:line-through;color:var(--muted)}
.it .nm{flex:1;min-width:0;font-weight:800}
.it .nm small{display:block;font-weight:700;color:var(--muted)}
.it .q{font-weight:800;color:var(--leaf-ink);white-space:nowrap}
.it .x{color:var(--coral-ink);font-size:20px;font-weight:800;padding:0 4px}
.addrow{display:flex;gap:8px;margin-top:10px}
details.cov{margin-top:18px}
details.cov summary{cursor:pointer;font-weight:800;color:var(--muted);padding:8px 0}

/* pantry */
.pi{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:8px;border-radius:18px}
.pi .nm{flex:1;min-width:0;text-align:left;font-weight:800;overflow-wrap:anywhere}
.stepper.mini output{min-width:64px;font-size:14px}
.stepper.mini button{width:30px;height:30px;font-size:18px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);box-shadow:0 -6px 22px rgba(60,40,120,.12);
  padding:8px max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:18px;font-weight:800;font-size:12px;color:var(--muted)}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{background:var(--tab-s);color:var(--tab-ink)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:40;max-width:90%;text-align:center;font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top"><h1 class="logo" aria-label="OrgaFood"><span>O</span><span>r</span><span>g</span><span>a</span><span>F</span><span>o</span><span>o</span><span>d</span></h1><div id="sub"></div></header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Navigation"><div class="in" role="tablist">
  <button role="tab" data-tab="recipes"><svg viewBox="0 0 24 24"><path d="M6 14a4 4 0 1 1 2-7.5A4 4 0 0 1 16 6a4 4 0 0 1 2 8v5H6z"/><path d="M6 17h12"/></svg>Recettes</button>
  <button role="tab" data-tab="plan"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>Planning</button>
  <button role="tab" data-tab="shop"><svg viewBox="0 0 24 24"><path d="M3 4h2.5l2.2 10.5h9.6L19.5 7H6.4"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>Courses</button>
  <button role="tab" data-tab="pantry"><svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M4 12h16M10 8h4M10 16h4"/></svg>Placards</button>
</div></nav>
<div id="sheet" aria-modal="true"><div class="panel" id="panel"></div></div>

<script>
(function(){
const KEY='orgafood.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const UNITS=['','g','kg','ml','l','càs','càc'];
const MEALS=[['matin','Petit-déj'],['midi','Déjeuner'],['soir','Dîner']];
const LOCALE='fr-FR';

/* ---------- dates ---------- */
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function monday(off){const d=new Date();d.setHours(12,0,0,0);const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd+off*7);return d}
function weekDays(off){const m=monday(off);return Array.from({length:7},(_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return d})}
function weekLabel(off){const w=weekDays(off),f=(d,o)=>d.toLocaleDateString(LOCALE,o);
  return 'Du '+f(w[0],{day:'numeric',month:w[0].getMonth()===w[6].getMonth()?undefined:'long'})+' au '+f(w[6],{day:'numeric',month:'long'})}

/* ---------- storage ---------- */
function seed(){
  const r=[
   {id:'r1',name:'Pâtes tomate-basilic',serv:4,time:20,photo:'',ings:[['pâtes',400,'g'],['tomates concassées',800,'g'],['oignon',1,''],['gousses d\'ail',2,''],['huile d\'olive',2,'càs'],['basilic frais',1,''],['parmesan',60,'g']],
    steps:'Faire cuire les pâtes dans une grande casserole d\'eau salée.\nFaire revenir l\'oignon et l\'ail émincés dans l\'huile d\'olive.\nAjouter les tomates et laisser mijoter 15 minutes.\nMélanger avec les pâtes, parsemer de basilic et de parmesan.'},
   {id:'r2',name:'Poulet rôti et légumes',serv:4,time:70,photo:'',ings:[['poulet entier',1,''],['pommes de terre',800,'g'],['carottes',400,'g'],['oignon',2,''],['huile d\'olive',2,'càs'],['thym',1,'càc']],
    steps:'Préchauffer le four à 200 °C.\nCouper les légumes en morceaux et les huiler.\nPoser le poulet sur les légumes, saler, poivrer et ajouter le thym.\nEnfourner 1 heure en arrosant de temps en temps.'},
   {id:'r3',name:'Pancakes du dimanche',serv:4,time:25,photo:'',ings:[['farine',250,'g'],['lait',400,'ml'],['œufs',2,''],['sucre',2,'càs'],['sachet de levure chimique',1,''],['beurre',30,'g']],
    steps:'Mélanger la farine, le sucre et la levure.\nAjouter les œufs puis le lait en fouettant.\nFaire cuire des louches de pâte dans une poêle beurrée, 2 minutes par face.'}
  ].map(x=>({...x,ings:x.ings.map(i=>({id:uid(),name:i[0],qty:i[1],unit:i[2]}))}));
  const w=weekDays(0).map(ymd);
  return {v:1,people:4,demo:true,recipes:r,
    plan:{[w[0]+'|soir']:{rid:'r1',people:4},[w[2]+'|soir']:{rid:'r2',people:4},[w[6]+'|midi']:{rid:'r3',people:4}},
    pantry:[{id:uid(),name:'pâtes',qty:500,unit:'g'},{id:uid(),name:'farine',qty:1000,unit:'g'},{id:uid(),name:'sucre',qty:300,unit:'g'},{id:uid(),name:'oignon',qty:2,unit:''},{id:uid(),name:'œufs',qty:6,unit:''}],
    checked:{},manual:{}};
}
let S=null;
try{const raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw)}catch(e){}
if(!S||!S.recipes)S=seed();
let warned=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!warned){warned=true;toast('Stockage indisponible ou plein : les changements ne seront pas conservés')}}}

/* ---------- helpers ---------- */
const V={tab:'recipes',week:0,q:'',serv:null};
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
const norm=s=>{let n=String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/œ/g,'oe').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();return n.length>3&&n.endsWith('s')?n.slice(0,-1):n};
function toBase(q,u){return u==='kg'?[q*1000,'g']:u==='l'?[q*1000,'ml']:[q,u]}
function numfmt(n){if(n>=10)return String(Math.round(n));return String(Math.round(n*100)/100).replace('.',',')}
function fmtQ(q,u){if(u==='g'&&q>=1000){q/=1000;u='kg'}else if(u==='ml'&&q>=1000){q/=1000;u='l'}return numfmt(q)+(u?' '+u:'')}
const stepFor=u=>u==='g'||u==='ml'?50:u==='kg'||u==='l'?0.5:1;
const AISLES=[['Fruits & légumes',/oignon|ail|tomate|carotte|pomme|poireau|courgette|salade|citron|basilic|persil|champignon|poivron|banane|fruit|legume|herbe|ciboulette|thym|aubergine|concombre|avocat/],
 ['Viande & poisson',/poulet|boeuf|porc|jambon|saumon|poisson|thon|lardon|steak|viande|dinde|crevette/],
 ['Frais',/lait|beurre|creme|oeuf|fromage|parmesan|yaourt|mozzarella|gruyere|emmental/],
 ['Épicerie',/./]];
const aisleOf=n=>{const k=norm(n);return AISLES.find(a=>a[1].test(k))[0]};
const recipeById=id=>S.recipes.find(r=>r.id===id);
const cvClass=id=>'cv'+([...String(id)].reduce((a,c)=>a+c.charCodeAt(0),0)%5);
const cover=(r,cls)=>r.photo?`<img class="${cls||'cover'}" src="${r.photo}" alt="">`:`<div class="${cls||'cover'} ${cvClass(r.id)}${cls?' th':''}">${esc((r.name[0]||'?').toUpperCase())}</div>`;

/* ---------- shopping computation ---------- */
function computeShop(off){
  const days=weekDays(off).map(ymd),need=new Map();
  for(const d of days)for(const [m] of MEALS){
    const s=S.plan[d+'|'+m];if(!s)continue;const r=recipeById(s.rid);if(!r)continue;
    const f=s.people/(r.serv||1);
    for(const i of r.ings){if(!i.name)continue;const [q,u]=toBase((+i.qty||0)*f,i.unit);const k=norm(i.name)+'|'+u;
      const e=need.get(k)||{key:k,name:i.name,unit:u,need:0};e.need+=q;need.set(k,e)}
  }
  const stock=new Map();
  for(const p of S.pantry){const [q,u]=toBase(+p.qty||0,p.unit);const k=norm(p.name)+'|'+u;stock.set(k,(stock.get(k)||0)+q)}
  const buy=[],covered=[];
  for(const e of need.values()){
    const have=stock.get(e.key)||0,toBuy=Math.max(0,e.need-have);
    const row={...e,have:Math.min(have,e.need),toBuy,aisle:aisleOf(e.name)};
    (toBuy>0.001?buy:covered).push(row);
  }
  buy.sort((a,b)=>a.name.localeCompare(b.name,'fr'));
  return {buy,covered};
}

/* ---------- views ---------- */
const TITLES={recipes:'Mes recettes',plan:'Planning',shop:'Liste de courses',pantry:'Mes placards'};
function render(){
  document.body.dataset.tab=V.tab;
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===V.tab));
  $('#sub').textContent=TITLES[V.tab];
  $('#view').innerHTML=({recipes:vRecipes,plan:vPlan,shop:vShop,pantry:vPantry})[V.tab]();
}
function demoBanner(){return S.demo?`<div class="banner"><span>Exemples pour démarrer. Modifiez-les ou videz tout.</span><button class="btn ghost small" data-act="clear-demo">Tout vider</button></div>`:''}

function vRecipes(){
  const q=norm(V.q),list=S.recipes.filter(r=>!q||norm(r.name).includes(q)||r.ings.some(i=>norm(i.name).includes(q)));
  return `${demoBanner()}<div class="head"><h2>${S.recipes.length} recette${S.recipes.length>1?'s':''}</h2><button class="btn" data-act="new-recipe">+ Nouvelle recette</button></div>
  <input class="search" id="q" type="search" placeholder="Chercher une recette ou un ingrédient" value="${esc(V.q)}">
  ${list.length?`<div class="grid">${list.map(r=>`<button class="card rc" data-act="open-recipe" data-id="${r.id}">${cover(r)}<span class="meta"><h3>${esc(r.name)}</h3><small>${r.time?r.time+' min · ':''}${r.serv} pers.</small></span></button>`).join('')}</div>`
  :`<div class="card empty"><b>${S.recipes.length?'Aucun résultat':'Votre carnet est vide'}</b>${S.recipes.length?'Essayez un autre mot.':'Ajoutez votre première recette avec une photo.'}</div>`}`;
}

function vPlan(){
  const days=weekDays(V.week),today=ymd(new Date());
  return `<div class="head"><div class="weeknav" style="flex:1"><button data-act="week" data-d="-1" aria-label="Semaine précédente">‹</button><div class="lbl">${weekLabel(V.week)}</div><button data-act="week" data-d="1" aria-label="Semaine suivante">›</button></div></div>
  <div class="head" style="margin-top:0"><span class="muted" style="font-weight:800">Nombre de personnes par défaut</span>
   <div class="stepper"><button data-act="hh" data-d="-1" aria-label="Moins">−</button><output>${S.people} pers.</output><button data-act="hh" data-d="1" aria-label="Plus">+</button></div></div>
  ${days.map(d=>{const k=ymd(d);return `<div class="card day${k===today?' today':''}"><div class="dn"><span>${d.toLocaleDateString(LOCALE,{weekday:'short'}).replace('.','')}</span><b>${d.getDate()}</b></div>
   <div class="slots">${MEALS.map(([m,l])=>{const s=S.plan[k+'|'+m],r=s&&recipeById(s.rid);
     return r?`<button class="slot filled" data-act="slot" data-k="${k}|${m}"><span class="t">${l}</span><span class="n">${esc(r.name)}</span><span class="p">${s.people} pers.</span></button>`
     :`<button class="slot" data-act="slot" data-k="${k}|${m}"><span class="t">${l}</span><span class="add">+ Ajouter un repas</span></button>`}).join('')}</div></div>`}).join('')}`;
}

function vShop(){
  const wk=ymd(monday(V.week)),{buy,covered}=computeShop(V.week),ch=(S.checked[wk]||{}),man=S.manual[wk]||[];
  const total=buy.length+man.length,done=buy.filter(i=>ch[i.key]).length+man.filter(i=>i.done).length;
  const groups={};buy.forEach(i=>(groups[i.aisle]=groups[i.aisle]||[]).push(i));
  const item=i=>`<button class="it${ch[i.key]?' done':''}" data-act="check" data-key="${esc(i.key)}"><span class="ck">✓</span><span class="nm">${esc(i.name)}${i.have>0?`<small>${fmtQ(i.have,i.unit)} déjà au placard</small>`:''}</span><span class="q">${fmtQ(i.toBuy,i.unit)}</span></button>`;
  return `<div class="head"><div class="weeknav" style="flex:1"><button data-act="week" data-d="-1" aria-label="Semaine précédente">‹</button><div class="lbl">${weekLabel(V.week)}</div><button data-act="week" data-d="1" aria-label="Semaine suivante">›</button></div></div>
  <div class="muted" style="font-weight:800">${done} / ${total} article${total>1?'s':''} cochés</div><div class="prog"><i style="width:${total?Math.round(done/total*100):0}%"></i></div>
  ${!buy.length&&!covered.length?`<div class="card empty"><b>Rien à acheter pour l'instant</b>Planifiez des repas : la liste se remplit toute seule, avec les quantités pour le bon nombre de personnes.</div>`:''}
  ${Object.keys(groups).sort((a,b)=>AISLES.findIndex(x=>x[0]===a)-AISLES.findIndex(x=>x[0]===b)).map(a=>`<div class="aisle">${a}</div>${groups[a].map(item).join('')}`).join('')}
  ${buy.some(i=>ch[i.key])?`<button class="btn" style="width:100%;justify-content:center;margin-top:8px" data-act="stock">Ranger les articles cochés dans les placards</button>`:''}
  <div class="aisle">Mes ajouts</div>
  ${man.map(m=>`<div class="it${m.done?' done':''}"><button class="ck" style="background:${m.done?'var(--leaf)':'none'}" data-act="mcheck" data-id="${m.id}" aria-label="Cocher">✓</button><span class="nm">${esc(m.name)}</span><button class="x" data-act="mdel" data-id="${m.id}" aria-label="Supprimer">×</button></div>`).join('')}
  <form class="addrow" id="madd"><input id="mname" placeholder="Ajouter un article (papier toilette…)" aria-label="Nouvel article"><button class="btn small" type="submit">Ajouter</button></form>
  ${covered.length?`<details class="cov"><summary>Déjà dans vos placards (${covered.length})</summary>${covered.map(i=>`<div class="it" style="box-shadow:none;opacity:.8"><span class="ck" style="border-color:var(--line)"></span><span class="nm">${esc(i.name)}</span><span class="q">${fmtQ(i.need,i.unit)}</span></div>`).join('')}</details>`:''}`;
}

function vPantry(){
  const list=[...S.pantry].sort((a,b)=>a.name.localeCompare(b.name,'fr'));
  return `<div class="head"><h2>${list.length} produit${list.length>1?'s':''}</h2><button class="btn" data-act="pantry-edit" data-id="">+ Ajouter</button></div>
  <p class="muted" style="margin:-6px 0 14px;font-weight:700">Ce que vous avez déjà est retiré de la liste de courses. Gardez la même unité que dans vos recettes.</p>
  ${list.length?list.map(p=>`<div class="card pi"><button class="nm" data-act="pantry-edit" data-id="${p.id}">${esc(p.name)}</button><div class="stepper mini"><button data-act="pq" data-id="${p.id}" data-d="-1" aria-label="Moins">−</button><output>${fmtQ(+p.qty||0,p.unit)}</output><button data-act="pq" data-id="${p.id}" data-d="1" aria-label="Plus">+</button></div></div>`).join('')
  :`<div class="card empty"><b>Placards vides</b>Ajoutez ce que vous avez à la maison.</div>`}`;
}

/* ---------- sheets ---------- */
function openSheet(html){$('#panel').innerHTML='<div class="grab"></div>'+html;$('#sheet').classList.add('open');$('#panel').scrollTop=0}
function closeSheet(){$('#sheet').classList.remove('open')}

function showRecipe(id){
  const r=recipeById(id);if(!r)return;V.rid=id;if(V.serv==null||V.servFor!==id){V.serv=r.serv;V.servFor=id}
  const f=V.serv/(r.serv||1),steps=r.steps.split('\n').map(s=>s.trim()).filter(Boolean);
  openSheet(`<div class="stack">
   <div class="hero">${cover(r)}</div>
   <div><h2 style="font-size:28px">${esc(r.name)}</h2><div class="muted" style="font-weight:700">${r.time?r.time+' min · ':''}recette pour ${r.serv} pers.</div></div>
   <div class="card" style="padding:14px 16px"><div class="head" style="margin:0 0 6px"><h3>Ingrédients</h3>
     <div class="stepper"><button data-act="serv" data-d="-1" aria-label="Moins">−</button><output>${V.serv} pers.</output><button data-act="serv" data-d="1" aria-label="Plus">+</button></div></div>
     <ul class="ilist">${r.ings.map(i=>`<li><span>${esc(i.name)}</span><b>${i.qty?fmtQ(i.qty*f,i.unit):''}</b></li>`).join('')}</ul></div>
   ${steps.length?`<div class="card" style="padding:16px"><h3 style="margin-bottom:12px">Préparation</h3><ol class="steps">${steps.map(s=>`<li><span>${esc(s)}</span></li>`).join('')}</ol></div>`:''}
   <div class="card" style="padding:14px 16px"><h3 style="margin-bottom:10px">Ajouter au planning</h3>
    <div class="row2"><select id="pd" aria-label="Jour">${weekDays(V.week).map(d=>`<option value="${ymd(d)}">${d.toLocaleDateString(LOCALE,{weekday:'long',day:'numeric'})}</option>`).join('')}</select>
    <select id="pm" aria-label="Repas">${MEALS.map(m=>`<option value="${m[0]}">${m[1]}</option>`).join('')}</select></div>
    <button class="btn" style="margin-top:10px;width:100%;justify-content:center" data-act="plan-to" data-id="${r.id}">Planifier pour ${V.serv} pers.</button></div>
   <div class="row2"><button class="btn ghost" data-act="edit-recipe" data-id="${r.id}">Modifier</button><button class="btn danger" data-act="del-recipe" data-id="${r.id}">Supprimer</button></div>
   <button class="btn ghost" data-act="close" style="justify-content:center">Fermer</button></div>`);
}

let draft=null;
const ingRow=(i,n)=>`<div class="ing"><input class="i-name" placeholder="Ingrédient" value="${esc(i.name)}" aria-label="Ingrédient"><input class="i-qty" inputmode="decimal" placeholder="Qté" value="${i.qty===''||i.qty==null?'':esc(String(i.qty).replace('.',','))}" aria-label="Quantité"><select class="i-unit" aria-label="Unité">${UNITS.map(u=>`<option value="${u}"${u===i.unit?' selected':''}>${u||'(aucune)'}</option>`).join('')}</select><button type="button" data-act="rm-ing" data-i="${n}" aria-label="Retirer">×</button></div>`;
function syncDraft(){
  if(!draft||!$('#r-name'))return;
  draft.name=$('#r-name').value;draft.serv=$('#r-serv').value;draft.time=$('#r-time').value;draft.steps=$('#r-steps').value;
  draft.ings=[...document.querySelectorAll('#ings .ing')].map(row=>({id:uid(),name:row.querySelector('.i-name').value,qty:row.querySelector('.i-qty').value,unit:row.querySelector('.i-unit').value}));
}
function showEditor(id){
  const r=id&&recipeById(id);
  draft=r?{id:r.id,name:r.name,serv:r.serv,time:r.time||'',photo:r.photo,steps:r.steps,ings:r.ings.map(i=>({...i}))}:{id:null,name:'',serv:2,time:'',photo:'',steps:'',ings:[{id:uid(),name:'',qty:'',unit:'g'},{id:uid(),name:'',qty:'',unit:'g'},{id:uid(),name:'',qty:'',unit:'g'}]};
  drawEditor();
}
function drawEditor(){
  const d=draft;
  openSheet(`<form id="rform" class="stack">
   <h2>${d.id?'Modifier la recette':'Nouvelle recette'}</h2>
   <label class="photo" for="photo" id="phbox">${d.photo?`<img src="${d.photo}" alt="Photo de la recette">`:`<div class="ph">Touchez pour ajouter une photo<br>(appareil photo ou photothèque)</div>`}</label>
   <input type="file" id="photo" accept="image/*" hidden>
   ${d.photo?`<button type="button" class="btn danger small" data-act="rm-photo" style="align-self:flex-start">Retirer la photo</button>`:''}
   <label class="f">Nom de la recette<input id="r-name" required value="${esc(d.name)}" placeholder="Ex. Lasagnes de Mamie"></label>
   <div class="row2"><label class="f">Pour combien de personnes ?<input id="r-serv" type="number" inputmode="numeric" min="1" value="${esc(d.serv)}"></label><label class="f">Temps (min)<input id="r-time" type="number" inputmode="numeric" min="0" value="${esc(d.time)}"></label></div>
   <div><h4 style="margin-bottom:8px">Ingrédients (pour ${esc(d.serv||'?')} pers.)</h4><div id="ings">${d.ings.map(ingRow).join('')}</div><button type="button" class="btn ghost small" data-act="add-ing">+ Ingrédient</button></div>
   <label class="f">Étapes (une par ligne)<textarea id="r-steps" rows="5" placeholder="Couper les légumes…">${esc(d.steps)}</textarea></label>
   <div class="row2"><button type="button" class="btn ghost" data-act="${d.id?'open-recipe':'close'}" data-id="${d.id||''}">Annuler</button><button class="btn" type="submit" style="justify-content:center">Enregistrer</button></div></form>`);
}
function resizePhoto(file){
  return new Promise((ok,ko)=>{const fr=new FileReader();fr.onerror=ko;fr.onload=()=>{const im=new Image();im.onerror=ko;im.onload=()=>{
    const M=720,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72))};im.src=fr.result};fr.readAsDataURL(file)});
}
function saveRecipe(){
  syncDraft();const d=draft;const name=d.name.trim();if(!name){toast('Donnez un nom à la recette');return}
  const rec={id:d.id||uid(),name,serv:Math.max(1,parseInt(d.serv)||1),time:parseInt(d.time)||0,photo:d.photo,steps:d.steps,
    ings:d.ings.filter(i=>i.name.trim()).map(i=>({id:i.id||uid(),name:i.name.trim(),qty:parseFloat(String(i.qty).replace(',','.'))||0,unit:i.unit}))};
  const ix=S.recipes.findIndex(r=>r.id===rec.id);ix>=0?S.recipes[ix]=rec:S.recipes.unshift(rec);
  save();V.servFor=null;draft=null;render();showRecipe(rec.id);toast('Recette enregistrée');
}
function showSlot(k){
  const s=S.plan[k]||{rid:null,people:S.people},[d,m]=k.split('|'),date=new Date(d+'T12:00:00');
  V.slot={k,rid:s.rid,people:s.people};
  drawSlot(date,m);
}
function drawSlot(date,m){
  const {rid,people}=V.slot;
  openSheet(`<div class="stack"><h2 style="text-transform:capitalize">${date.toLocaleDateString(LOCALE,{weekday:'long',day:'numeric',month:'long'})} · ${(MEALS.find(x=>x[0]===m)||[0,m])[1].toLowerCase()}</h2>
   <div class="head" style="margin:0"><b>Nombre de personnes</b><div class="stepper"><button data-act="sp" data-d="-1" aria-label="Moins">−</button><output>${people} pers.</output><button data-act="sp" data-d="1" aria-label="Plus">+</button></div></div>
   ${S.recipes.length?S.recipes.map(r=>`<button class="pick" data-act="pick" data-id="${r.id}" style="${r.id===rid?'outline:3px solid var(--sky)':''}">${cover(r,'th')}<span style="flex:1;min-width:0"><b>${esc(r.name)}</b><br><small class="muted">${r.time?r.time+' min':''}</small></span></button>`).join(''):`<div class="card empty"><b>Aucune recette</b>Créez d'abord une recette dans l'onglet Recettes.</div>`}
   <div class="row2">${S.plan[V.slot.k]?`<button class="btn danger" data-act="slot-clear">Retirer ce repas</button>`:`<span></span>`}<button class="btn ghost" data-act="close" style="justify-content:center">Fermer</button></div></div>`);
}
function showPantry(id){
  const p=S.pantry.find(x=>x.id===id)||{id:'',name:'',qty:'',unit:'g'};
  openSheet(`<form id="pform" class="stack" data-id="${p.id}"><h2>${p.id?'Modifier le produit':'Nouveau produit'}</h2>
   <label class="f">Produit<input id="p-name" required value="${esc(p.name)}" placeholder="Ex. farine"></label>
   <div class="row2"><label class="f">Quantité<input id="p-qty" inputmode="decimal" value="${esc(String(p.qty).replace('.',','))}" placeholder="500"></label>
   <label class="f">Unité<select id="p-unit">${UNITS.map(u=>`<option value="${u}"${u===p.unit?' selected':''}>${u||'(aucune)'}</option>`).join('')}</select></label></div>
   <div class="row2">${p.id?`<button type="button" class="btn danger" data-act="pantry-del" data-id="${p.id}">Supprimer</button>`:`<button type="button" class="btn ghost" data-act="close">Annuler</button>`}<button class="btn" type="submit" style="justify-content:center">Enregistrer</button></div></form>`);
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const tb=e.target.closest('.tabs button');if(tb){V.tab=tb.dataset.tab;render();scrollTo(0,0);return}
  if(e.target.id==='sheet'){closeSheet();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,dl=+b.dataset.d;
  switch(a){
   case 'close':closeSheet();break;
   case 'new-recipe':showEditor();break;
   case 'open-recipe':showRecipe(id);break;
   case 'edit-recipe':showEditor(id);break;
   case 'del-recipe':
     if(!b.dataset.ok){b.dataset.ok=1;b.textContent='Confirmer la suppression';break}
     S.recipes=S.recipes.filter(r=>r.id!==id);for(const k of Object.keys(S.plan))if(S.plan[k].rid===id)delete S.plan[k];save();closeSheet();render();toast('Recette supprimée');break;
   case 'serv':V.serv=Math.max(1,V.serv+dl);showRecipe(V.rid);break;
   case 'plan-to':{const k=$('#pd').value+'|'+$('#pm').value;S.plan[k]={rid:id,people:V.serv};save();closeSheet();render();toast('Ajouté au planning');break}
   case 'add-ing':syncDraft();draft.ings.push({id:uid(),name:'',qty:'',unit:'g'});drawEditor();document.querySelectorAll('#ings .i-name')[draft.ings.length-1].focus();break;
   case 'rm-ing':syncDraft();draft.ings.splice(+b.dataset.i,1);drawEditor();break;
   case 'rm-photo':syncDraft();draft.photo='';drawEditor();break;
   case 'week':V.week+=dl;render();break;
   case 'hh':S.people=Math.min(30,Math.max(1,S.people+dl));save();render();break;
   case 'slot':showSlot(b.dataset.k);break;
   case 'sp':V.slot.people=Math.min(30,Math.max(1,V.slot.people+dl));{const[d,m]=V.slot.k.split('|');drawSlot(new Date(d+'T12:00:00'),m)}
     if(V.slot.rid){S.plan[V.slot.k]={rid:V.slot.rid,people:V.slot.people};save();render()}break;
   case 'pick':S.plan[V.slot.k]={rid:id,people:V.slot.people};save();closeSheet();render();toast('Repas planifié');break;
   case 'slot-clear':delete S.plan[V.slot.k];save();closeSheet();render();break;
   case 'check':{const wk=ymd(monday(V.week));S.checked[wk]=S.checked[wk]||{};const k=b.dataset.key;S.checked[wk][k]=!S.checked[wk][k];save();render();break}
   case 'mcheck':{const m=(S.manual[ymd(monday(V.week))]||[]).find(x=>x.id===id);if(m){m.done=!m.done;save();render()}break}
   case 'mdel':{const wk=ymd(monday(V.week));S.manual[wk]=(S.manual[wk]||[]).filter(x=>x.id!==id);save();render();break}
   case 'stock':{const wk=ymd(monday(V.week)),ch=S.checked[wk]||{},{buy}=computeShop(V.week);let n=0;
     for(const i of buy)if(ch[i.key]){const p=S.pantry.find(x=>norm(x.name)+'|'+toBase(1,x.unit)[1]===i.key);
       if(p){const [q]=toBase(+p.qty||0,p.unit);p.qty=q+i.toBuy;p.unit=i.unit}else S.pantry.push({id:uid(),name:i.name,qty:Math.round(i.toBuy*100)/100,unit:i.unit});
       delete ch[i.key];n++}
     save();render();toast(n+' article'+(n>1?'s rangés':' rangé')+' dans les placards');break}
   case 'pantry-edit':showPantry(id);break;
   case 'pantry-del':S.pantry=S.pantry.filter(p=>p.id!==id);save();closeSheet();render();break;
   case 'pq':{const p=S.pantry.find(x=>x.id===id);if(p){p.qty=Math.max(0,(+p.qty||0)+dl*stepFor(p.unit));save();render()}break}
   case 'clear-demo':S.recipes=[];S.plan={};S.pantry=[];S.checked={};S.manual={};S.demo=false;save();render();break;
  }
});
document.addEventListener('change',async e=>{
  if(e.target.id==='photo'&&e.target.files[0]){
    try{syncDraft();draft.photo=await resizePhoto(e.target.files[0]);drawEditor()}catch(x){toast('Impossible de lire cette photo')}
  }
});
document.addEventListener('input',e=>{if(e.target.id==='q'){V.q=e.target.value;const p=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(p,p)}});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='rform')saveRecipe();
  if(e.target.id==='madd'){const v=$('#mname').value.trim();if(!v)return;const wk=ymd(monday(V.week));(S.manual[wk]=S.manual[wk]||[]).push({id:uid(),name:v,done:false});save();render()}
  if(e.target.id==='pform'){const id=e.target.dataset.id,name=$('#p-name').value.trim();if(!name)return;
    const o={name,qty:parseFloat($('#p-qty').value.replace(',','.'))||0,unit:$('#p-unit').value};
    if(id){Object.assign(S.pantry.find(p=>p.id===id),o)}else S.pantry.push({id:uid(),...o});save();closeSheet();render()}
});
render();
})();
</script>
